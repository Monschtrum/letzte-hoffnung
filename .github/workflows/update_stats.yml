name: 🔄 Clash of Clans Live-Stats Auto-Update

on:
  schedule:
    # Alle 6 Stunden automatisch ausführen
    - cron: '0 */6 * * *'
  workflow_dispatch: # Erlaubt manuelles Starten per Klick im GitHub Dashboard

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Live-Stats abrufen
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
        run: python update_stats.py

      - name: Änderungen committen & pushen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.md _data/clan_stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-Update: CoC Live-Stats" && git push)
